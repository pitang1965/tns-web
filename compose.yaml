# セルフホスト用。使い方は docs/self-hosting/poc-log.md を参照。
#   docker compose build
#   docker compose up -d
#
# イメージの版（タグ）は APP_IMAGE_TAG で切り替える（未指定なら local）。
#   APP_IMAGE_TAG=$(git rev-parse --short HEAD) docker compose build   # 版を付けてビルド
#   APP_IMAGE_TAG=<戻したい版> docker compose up -d app                 # 切り戻し
#
# .env.docker は Git 管理外（.gitignore の .env.*）。ビルド時は secret として、
# 実行時は env_file として同じファイルを渡す。

services:
  app:
    build:
      context: .
      args:
        # next.config.mjs は .env* より先に評価されるため、ビルド引数として渡す
        APP_ENV: ${APP_ENV:-}
      secrets:
        - buildenv
    image: tns-web:${APP_IMAGE_TAG:-local}
    # 動いている版を後から判別できるようにする（scripts/deploy-vps.sh が切り戻し先の特定に使う）
    labels:
      app.image.tag: ${APP_IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    # 家庭内LANへは公開しない。外部からは Cloudflare Tunnel 経由でのみ到達させる
    ports:
      - '127.0.0.1:3000:3000'
    env_file:
      - .env.docker

  # Cloudflare Tunnel のコネクタ。トークンを用意してから有効にする:
  #   docker compose --profile tunnel up -d
  # 公開ホスト名の転送先は Cloudflare のダッシュボードで http://app:3000 を指定する。
  # .env.tunnel（Git 管理外）に TUNNEL_TOKEN=... を書く。
  tunnel:
    image: cloudflare/cloudflared:2026.9.1
    profiles:
      - tunnel
    command: tunnel --no-autoupdate run
    restart: unless-stopped
    env_file:
      - .env.tunnel
    depends_on:
      app:
        condition: service_healthy

secrets:
  # ビルド時に読ませる環境変数ファイル。既定は実行用と同じ .env.docker。
  # 別の環境向けにビルドするときは BUILD_ENV_FILE で切り替える（例: 本番用の .env.production.vps）
  buildenv:
    file: ${BUILD_ENV_FILE:-.env.docker}
